spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:parking}
    username: ${DB_USER:parking}
    password: ${DB_PASSWORD:parking}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.parking: INFO
