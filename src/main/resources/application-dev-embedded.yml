# Self-contained development profile: H2 in-memory + simple cache, no Postgres / no Redis.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev-embedded

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:parkingdev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  h2:
    console:
      enabled: true
      path: /h2

app:
  ml:
    simulate-sensors: true

logging:
  level:
    org.flywaydb: INFO
