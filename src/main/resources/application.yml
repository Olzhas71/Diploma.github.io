spring:
  application:
    name: parking-system
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-very-long-development-secret-key-1234567890}
    access-token-expiration-ms: 3600000      # 1 hour
    refresh-token-expiration-ms: 2592000000  # 30 days
    issuer: parking-system
  cors:
    allowed-origins: "*"
  ml:
    occupancy-prediction-window-hours: 24
    history-window-days: 30
  security:
    public-paths: /auth/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/actuator/health,/actuator/info,/ws/**,/h2/**

logging:
  level:
    root: INFO
    com.parking: DEBUG
    org.springframework.security: INFO
