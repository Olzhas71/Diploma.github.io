spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:parkingtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: simple

app:
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key-1234567890
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
    issuer: parking-system-test
  cors:
    allowed-origins: "*"
  ml:
    occupancy-prediction-window-hours: 24
    history-window-days: 7
    simulate-sensors: false
  security:
    public-paths: /auth/**,/v3/api-docs/**,/swagger-ui/**,/actuator/health,/ws/**
    rate-limit:
      auth-requests-per-window: 1000
      auth-window-seconds: 60
